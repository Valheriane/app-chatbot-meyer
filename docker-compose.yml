services:
  db:
    image: pgvector/pgvector:pg16
    container_name: meyer-rag-db
    environment:
      POSTGRES_DB: meyer_rag
      POSTGRES_USER: meyer
      POSTGRES_PASSWORD: meyer_password
    ports:
      - "5432:5432"
    volumes:
      - meyer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meyer -d meyer_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meyer-rag-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meyer-rag-frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  meyer_pg_data:
  hf_cache: